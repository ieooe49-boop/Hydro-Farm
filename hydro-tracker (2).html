<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydro Farm Tracker</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .menu-btn {
            padding: 25px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            text-align: left;
            min-height: 70px;
            width: 100%;
            margin-bottom: 15px;
        }
        .menu-btn:hover { border-color: #667eea; background: #f0f4ff; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-message {
            background: #4caf50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Hydro Farm Tracker</h1>
        <p class="subtitle">Track maintenance & harvests</p>
        
        <div id="loading-screen" class="screen active">
            <div class="loading">
                <div class="spinner"></div>
                <p>Connecting to database...</p>
            </div>
        </div>
        
        <div id="main-menu" class="screen">
            <button class="menu-btn" onclick="testConnection()">✅ Test Database Connection</button>
            <div id="test-result"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udjuhqkaqnzolsyphpbp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkanVocWthcW56b2xzeXBocGJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTU0MDQsImV4cCI6MjA5MTg5MTQwNH0.-KB1CEiZyU-VHOU_6nOUR09RnFvgfFi0VLMc7RBclZ0';
        
        async function testConnection() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Testing...</p></div>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/harvests?select=count`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success-message">✅ DATABASE CONNECTED SUCCESSFULLY!</div>';
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<div style="background:#f44336;color:white;padding:20px;border-radius:8px;">❌ Error: ${response.status} - ${error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="background:#f44336;color:white;padding:20px;border-radius:8px;">❌ Connection Error: ${error.message}</div>`;
            }
        }
        
        async function init() {
            await testConnection();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
        }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
